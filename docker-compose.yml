version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: canteen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canteen_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./canteen
      dockerfile: Dockerfile
    container_name: canteen-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-canteen_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVER_PORT: ${SERVER_PORT:-8080}
    # No ports exposed - only accessible via frontend nginx proxy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - canteen-network
    restart: unless-stopped

  frontend:
    build:
      context: ./canteen-frontend
      dockerfile: Dockerfile
    container_name: canteen-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${SERVER_PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_INTERNAL_PORT:-80}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-80}"
    depends_on:
      - backend
    networks:
      - canteen-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  canteen-network:
    driver: bridge